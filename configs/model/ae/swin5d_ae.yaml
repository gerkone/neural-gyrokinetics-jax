decouple_mu: true
latent_dim: 1024
num_layers: 1
# linear init from scratch as in the torch reference (null: equinox default)
init_weights: kaiming_uniform
# zero last unpatch layer: training starts at a zero reconstruction instead of a large random one
zero_init_output: true
hidden_mlp_ratio: 2.0
patch:
  patch_size: [4, 0, 4, 5, 4]
  window_size: [4, 0, 4, 9, 4]
  merging_depth: 2
  unmerging_depth: 2
  merging_hidden_ratio: 1.0
  unmerging_hidden_ratio: 1.0
  c_multiplier: 1
  # linear | cconv | tucker (continuous convolutions: patch / unpatch kernels of the point coordinates)
  type: linear
  # continuous-convolution options (cconv: rank, code_modes; tucker: ranks, hidden, modes); merging_depth / unmerging_depth 1 make the heads linear
  field: {rank: 96}
vit:
  num_heads: [16]
  depth: [8]
  use_rpb: true
  gated_attention: true
  qk_norm: true
  qkv_bias: false
  drop_path: 0.1
bottleneck:
  dim: 256
  depth: 2
  num_heads: 4
  normalized_latent: false
