decouple_mu: true
latent_dim: 1024
num_layers: 1
hidden_mlp_ratio: 2.0
patch:
  patch_size: [4, 0, 4, 5, 4]
  window_size: [4, 0, 4, 9, 4]
  merging_depth: 2
  unmerging_depth: 2
  merging_hidden_ratio: 1.0
  unmerging_hidden_ratio: 1.0
  c_multiplier: 1
  # linear | smooth | dct (field patching: patch / unpatch weights generated from the point coordinates)
  type: linear
  # field patching options (smooth: rank, hidden, depth, code_modes, band_limited; dct: ranks, learned, position); merging_depth / unmerging_depth 1 make the heads linear
  field: {rank: 96, hidden: 256, depth: 2}
vit:
  num_heads: [16]
  depth: [8]
  use_rpb: true
  gated_attention: true
  qk_norm: true
  qkv_bias: false
  drop_path: 0.1
bottleneck:
  dim: 256
  depth: 2
  num_heads: 4
  normalized_latent: false
