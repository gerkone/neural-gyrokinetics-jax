batch_size: 4
n_epochs: 1500
learning_rate: 3.0e-4
final_learning_rate: 3.0e-6
weight_decay: 1.0e-4
clip_grad: true
clip_to: 1.0
exclude_from_wd: []
save_every_n_epochs: 500
# --- fixed shared support (Approach A) ---
fixed_support: union       # union (all seen coords) | topk (top-M by appearance frequency)
topk_M: 20000              # cap for fixed_support=topk (ignored for union)
