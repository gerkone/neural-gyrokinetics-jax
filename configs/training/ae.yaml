batch_size: 1  # per device; the global batch is batch_size * device_count
n_epochs: 1
learning_rate: 3.0e-4
final_learning_rate: 1.0e-6
weight_decay: 1.0e-6
clip_grad: true
clip_to: 1.0
exclude_from_wd: [cond, pos_embed]
# amp: training reads <dtype> shards (fp32 + on-the-fly quantize when missing); validation stays fp32
amp:
  enable: false
  dtype: bf16
num_workers: 4  # sample-reading threads
prefetch: 2     # batches loaded ahead of the step
save_every_n_epochs: 1
batch_transform: true  # readers serve raw frames; zf split and normalization run once per batch on device
compute_dtype: null  # bf16: forward on a bf16 copy of the fp32 weights (torch autocast)
