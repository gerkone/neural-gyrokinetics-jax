batch_size: 2  # per device
n_epochs: 1
learning_rate: 1.0e-4
final_learning_rate: 1.0e-6
weight_decay: 0.0
clip_grad: true
clip_to: 1.0
exclude_from_wd: []
precompute_batch: 2  # ae encoding batch for the latent cache
num_workers: 4  # sample-reading threads
prefetch: 2     # batches loaded ahead of the step
save_every_n_epochs: 1
