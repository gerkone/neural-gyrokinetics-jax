batch_size: 8
n_epochs: 1
learning_rate: 1.0e-4
final_learning_rate: 1.0e-6
weight_decay: 0.0
clip_grad: true
clip_to: 1.0
exclude_from_wd: []
precompute_batch: 2
# timesteps per trajectory in a batch: the field encoder runs batch_size / cond_group_size
# times per step instead of batch_size times
cond_group_size: 4
# in-epoch progress print (0 disables)
log_every_n_steps: 100
