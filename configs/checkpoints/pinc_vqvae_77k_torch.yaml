  - iteration_274.h5
  - iteration_278.h5
  - iteration_282.h5
  - iteration_286.h5
  - iteration_291.h5
  - iteration_295.h5
  - iteration_299.h5
  partial_holdouts: null
  training_cond_filters:
    last_flux:
    - 1.0
    - .inf
    first_flux:
    - 1.0
    - .inf
  eval_cond_filters:
    last_flux:
    - 1.0
    - .inf
    first_flux:
    - 1.0
    - .inf
  augment:
    noise:
      active: false
      noise_std: 0.0001
    mask_modes:
      active: false
      mask_ratio: 0.1
      is_fourier: false
      weights: null
      rescale: false
      mask_zero_mode: true
      df_delta_weight: 1.0
    vicreg_variance:
      active: false
      weight: 1.0
    logdet:
      active: false
      weight: 1.0
  offset: 80
  timestep_std_filter: null
  timestep_std_offset: 80
model:
  name: vqvae
  model_type: vqvae
  bundle_seq_length: 1
  latent_dim: 1024
  act_fn: GELU
  norm_fn: RMSNorm
  decouple_mu: true
  encoder_conditioning: []
  decoder_conditioning:
  - itg
  - dg
  - s_hat
  - q
  extra_zf_loss: false
  init_weights: kaiming_uniform
  patching_init_weights: kaiming_uniform
  cond_init_weights: normal_smallvar
  loss_scheduler: {}
  loss_weights:
    df: 1.0
    vq_commit: 1.0
  extra_loss_weights: {}
  patch:
    patch_size:
    - 4
    - 0
    - 2
    - 5
    - 4
    window_size:
    - 4
    - 0
    - 4
    - 9
    - 4
    merging_depth: 2
    unmerging_depth: 2
    merging_hidden_ratio: 1.0
    unmerging_hidden_ratio: 1.0
    c_multiplier: 1.0
  vit:
    num_heads:
    - 16
    depth:
    - 8
    gradient_checkpoint: false
    use_abs_pe: false
    use_rpb: true
    use_rope: false
    gated_attention: true
    modulation: dit
    drop_path: 0.1
    qk_norm: true
  bottleneck:
    dim: 32
    norm_learnable: false
    normalized_latent: false
    num_heads: 4
    depth: 2
  vq:
    codebook_size: 8192
    embedding_dim: 256
    commitment_weight: 0.25
    codebook_type: euclidean
    ema_decay: 0.99
    threshold_ema_dead_code: 2
    quantizer: fsq
    levels:
    - 8
    - 8
    - 8
    - 5
    - 5
    - 5
  legacy_swin_shortcut: true
training:
  batch_size: 32
  n_epochs: 400
  num_workers: 1
  pin_memory: true
  learning_rate: 0.0003
  use_latest_checkpoint: false
  final_learning_rate: 1.0e-06
  weight_decay: 1.0e-06
  exclude_from_wd:
  - cond
  predict_delta: false
  scheduler: cosine
  optimizer: adam
  muon_lr_multiplier: 100
  clip_grad: true
  clip_to: 1.0
  gradnorm_balancer: none
  integral_precision: float64
  params_to_include: null
  pushforward:
    epochs:
    - 100
    - 130
    - 160
    unrolls:
    - 0
    - 0
    - 0
    probs:
    - 10
    - 10
    - 5
  pretraining: false
  pretraining_kwargs:
    freeze_after: false
    clip_grad: false
    scheduler: null
    weight_decay: 1.0e-05
    lr: 0.001
    n_epochs: 35
    target_modules:
    - patch_embed
    - unpatch
    add_noise: false
  physics_mode: two_stage
  integral_loss_type: relative_l1
  spectral_loss_type: relative_l1
  eval_loss_type: mse
validation:
  batch_size: 16
  n_eval_steps: 2
  validate_every_n_epochs: 20
  eval_integrals: true
  eval_sample_steps: null
  model_selection_metric: df
  eval_metric: null
  probe:
    targets:
    - flux
    - ion_temp_grad
    - density_grad
    - q
    - s_hat
    - kyspec
    - fluxspec
    - fluxavg
    sizes:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 32
    - 32
    - 1
    tsne_targets:
    - flux
choices:
  experiment: ae_1000x_two_stage_pretrain
  validation: default
  training: default
  logging: wandb
  model: pinc/ae
  dataset: pinc
  hydra/env: default
  hydra/callbacks: null
  hydra/job_logging: default
  hydra/hydra_logging: default
  hydra/hydra_help: default
  hydra/help: default
  hydra/sweeper: basic
  hydra/launcher: basic
  hydra/output: default
