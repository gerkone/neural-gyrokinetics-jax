# torch config of the jax pinc_revival_vqvae model (export_pinc_torch.py --torch-config): the pinc_revival ae
# architecture with an fsq bottleneck on the s-patch-2 grid, 576 codes of 16 bits per snapshot (77369x)
experiment_id: pinc_revival_vqvae_77k (jax-trained, the torch ae architecture with
  an fsq bottleneck on the s-patch-2 grid)
seed: 0
output_path: null
ddp:
  enable: true
  n_nodes: 1
  debug: false
deepspeed:
  enable: false
  zero_stage: 2
  offload_optimizer: true
  offload_param: false
  offload_activations: false
  allgather_bucket_size: 500000000.0
  reduce_bucket_size: 500000000.0
amp:
  enable: true
  bfloat: true
mode: train
eval: true
device: cuda
load_ckpt: false
workflow: pinc
stage: autoencoder
ae_checkpoint: null
dataset:
  name: cyclone
  path: /local00/bioinf/galletti/preprocessed_kvikio
  backend: gds
  gds_override: false
  prefer_dtype: bf16
  normalization:
    df:
      type: zscore
      agg_axes:
      - 1
      - 3
      - 4
      - 5
    flux:
      type: zscore
      agg_axes: null
    phi:
      type: zscore
      agg_axes:
      - 0
      - 1
      - 2
  normalization_scope: dataset
  minmax_beta1: 8
  minmax_beta2: 4
  subsample: 1
  val_subsample: 10
  spatial_ifft: true
  separate_zf: true
  norm_decouple_mu: true
  real_potens: true
  split_into_bands: null
  log_transform: false
  num_workers: 10
  active_keys:
  - re
  - im
  input_fields:
  - df
  training_trajectories: iteration_{1-2,4-7,9-19,21-35,37-40,42-47,49,51-54,56-64,66-72,74-78,80-84,86-93,95-99,101-103,105-107,109-112,114-116,118-120,122-124,126-129,131-133,135-137,139-141,143-145,147-149,152-154,156-158,160-162,164-167,169-171,173-175,177-179,181-184,186-188,190-192,194-196,198-201,203-205,207-209,211-213,215-217,219-222,224,226,228-230,232-234,236-239,241-243,245-247,249-251,253-256,258-260,262-264,266-268,270-273,275-277,279-281,283-285,287-289,292-294,296-298}.h5
  validation_trajectories:
  - iteration_3.h5
  - iteration_50.h5
  - iteration_150.h5
  - iteration_225.h5
  - iteration_290.h5
  test_trajectories:
  - iteration_0.h5
  - iteration_8.h5
  - iteration_20.h5
  - iteration_36.h5
  - iteration_41.h5
  - iteration_48.h5
  - iteration_55.h5
  - iteration_65.h5
  - iteration_73.h5
  - iteration_79.h5
  - iteration_85.h5
  - iteration_94.h5
  - iteration_100.h5
